name: APK Derle

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Proje dosyalarini hazirla
        run: |
          mkdir -p www
          cp Esma_1.html www/index.html
          echo '{"name":"zikir","version":"1.0.0","private":true,"dependencies":{"@capacitor/android":"^6.2.0","@capacitor/cli":"^6.2.0","@capacitor/core":"^6.2.0"}}' > package.json
          echo '{"appId":"com.gokhan.zikirplatformu","appName":"Zikir Platformu","webDir":"www"}' > capacitor.config.json
      - name: Android projesini olustur
        run: |
          npm install
          npx cap add android
          npx cap sync android
      - name: APK derle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Zikir-Platformu-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
